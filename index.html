<!doctype html>
<html lang="ko">
<head>

  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }

  <script src="src/core/random.js"></script>
  <script src="src/core/input.js"></script>
  <script src="src/engine/tilemap.js"></script>
  <script src="src/engine/physics.js"></script>
  <script src="src/game/entities.js"></script>
  <script src="src/game/abilities.js"></script>
  <script src="src/game/rooms.js"></script>
  <script src="src/game/roomgen.js"></script>
  <script src="src/game/game.js"></script>
  <script src="src/render/renderer.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
